name: Publish to npm and GitHub Release

on:
  push:
    tags:
      - '*.*.*'
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build-and-publish:
    name: Build, Publish to npm, and Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write       # Needed to create GitHub Release and upload assets
      id-token: write       # Needed for npm provenance

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint and build
        run: |
          bun run lint
          bun run build

      - name: Publish to npm
        run: npm publish --access public --provenance

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tar -czf tg-blog-dist.tar.gz -C dist .
          PREV_TAG=$(git describe --tags --abbrev=0 "${{ github.ref_name }}^" 2>/dev/null || echo "")
          echo "## What's Changed" > release_notes.md
          echo "" >> release_notes.md
          if [ -n "$PREV_TAG" ]; then
            git log "${PREV_TAG}..${{ github.ref_name }}" --pretty=format:"### %s (%h)%n%n%b" --no-merges >> release_notes.md
            echo "" >> release_notes.md
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${{ github.ref_name }}" >> release_notes.md
          else
            git log -1 "${{ github.ref_name }}" --pretty=format:"### %s (%h)%n%n%b" >> release_notes.md
          fi
          gh release create "${{ github.ref_name }}" tg-blog-dist.tar.gz --title "${{ github.ref_name }}" --notes-file release_notes.md
